name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: merton-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name merton-web \
            -p 127.0.0.1:3000:3000 \
            -e ORIGIN=http://localhost:3000 \
            merton-web:ci
          trap 'docker logs merton-web || true; docker rm -f merton-web || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "merton-web did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)"
          test "$status" = "200"
