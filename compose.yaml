services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      merton:
        ipv4_address: 172.28.0.10

  api:
    build: ${MERTON_API_CONTEXT:-../merton-api}
    image: merton-api:local
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: sqlite:///app/data/merton.db
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY (e.g. openssl rand -base64 48)}
      APP_TRUSTED_ORIGINS: ${APP_TRUSTED_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10}
      AUTH_MAX_CONCURRENT_HASHES: ${AUTH_MAX_CONCURRENT_HASHES:-4}
      RUST_LOG: ${RUST_LOG:-merton_api=info,tower_http=info,sqlx=warn}
    volumes:
      - merton-data:/app/data
    networks:
      - merton

  web:
    build: .
    image: merton-web:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:8080}
    networks:
      - merton

networks:
  merton:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  merton-data:
